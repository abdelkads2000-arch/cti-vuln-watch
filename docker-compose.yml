name: cti

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: cti-agent:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    CTI_CONFIG_DIR: /app/config
    TZ: ${TZ:-Europe/Paris}
  volumes:
    # Config is mounted so that inventory / sources / rules can be edited without rebuild.
    # Read-write only for sources.yaml edits made by `cti source add/enable/disable`.
    - ./config:/app/config
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # Official Postgres 16 + pgvector extension preinstalled (used in phase 2).
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cti}
      POSTGRES_USER: ${POSTGRES_USER:-cti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant: lancer ./start.sh}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: never exposed on the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    restart: unless-stopped
    command: ["worker"]
    healthcheck:
      # Heartbeat written every 30 s by the scheduler.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(date -r /tmp/cti_worker_heartbeat +%s 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # One-shot CLI container used by ./cti (not started by ./start.sh).
  cli:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["cti"]
    command: ["--help"]

  # Test runner: ./test.sh — uses a dedicated database on the same server, no network access needed.
  test:
    <<: *app
    profiles: ["tools"]
    environment:
      CTI_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cti}:${POSTGRES_PASSWORD}@db:5432/postgres
      CTI_CONFIG_DIR: /app/config
    volumes: []
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    command: ["tests"]

  backup:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    # Runs as the unprivileged "postgres" user of the image.
    user: "999:999"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-cti}
      PGUSER: ${POSTGRES_USER:-cti}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "/backup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last_backup_ok"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  pgdata:
