# Step 0 skeleton: database + backups. The app / scheduler / web services are
# added in phase 1 once the architecture is validated.
name: cti

services:
  db:
    # Official Postgres 16 + pgvector extension preinstalled (needed in phase 2).
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cti}
      POSTGRES_USER: ${POSTGRES_USER:-cti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant: lancer ./start.sh}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: never exposed on the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    # Runs as the unprivileged "postgres" user of the image.
    user: "999:999"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-cti}
      PGUSER: ${POSTGRES_USER:-cti}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "/backup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last_backup_ok"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  pgdata:
