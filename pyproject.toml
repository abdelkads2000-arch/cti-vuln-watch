[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-vulnwatch"
version = "0.1.0"
description = "Vulnerability / CTI watch agent for a SOC MSSP"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "apscheduler>=3.10,<4",
  "typer>=0.12",
  "rich>=13",
  "anthropic>=0.40",
  "tenacity>=9",
  "packaging>=24",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cti = "cti.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cti = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py", "notifiers/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["db: requires a PostgreSQL database (CTI_TEST_DATABASE_URL or pgserver)"]
