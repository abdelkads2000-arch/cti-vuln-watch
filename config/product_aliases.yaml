    vendor: Citrix
    name: NetScaler ADC
    aliases: [NetScaler ADC, Citrix ADC, NetScaler, Citrix NetScaler ADC, NetScaler ADC FIPS, NetScaler ADC NDcPP]
    cpe: [citrix:netscaler_application_delivery_controller, citrix:application_delivery_controller, citrix:netscaler_adc]
    version_scheme: citrix   # "14.1-73.37"

  - id: citrix-netscaler-gateway
