# Catalogue de produits canoniques. Le matching inventaire <-> vulnérabilité
# utilise : (1) le CPE vendor:product, (2) les alias (comparaison normalisée,
# insensible à la casse et à la ponctuation).
# Ajouter ici tout produit présent dans les inventaires clients.

products:
